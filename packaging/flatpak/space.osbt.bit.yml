app-id: space.osbt.bit
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: bit
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri

  # 系统托盘、通知
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

  # DBus 会话总线（Tauri 部分桌面通知需要）
  - --own-name=space.osbt.bit.*

  # 文件权限：Agent 需要读写，Flathub 审核可协商；优先 xdg，兜底 home
  - --filesystem=xdg-config
  - --filesystem=xdg-cache
  - --filesystem=home

  - --socket=pulseaudio

  # 读取系统图标主题
  - --filesystem=xdg-data/icons:ro

modules:
  - name: vala
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --disable-valadoc
      - make -j$(nproc)
      - make install
    cleanup:
      - /share/doc
      - /share/man
      - /lib/pkgconfig
      - /include
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vala/0.56/vala-0.56.17.tar.xz
        sha256: 26100c4e4ef0049c619275f140d97cf565883d00c7543c82bcce5a426934ed6a

  - name: ayatana-ido
    buildsystem: cmake-ninja
    build-commands:
      # 构建阶段直接移除 gobject‑introspection 工具，cmake检测不到，整套内省逻辑直接跳过
      - rm -f /usr/bin/g-ir-compiler /usr/bin/g-ir-scanner
    config-opts:
      - -DENABLE_GTKDOC=OFF
      - -DBUILD_VAPI=OFF
      - -DENABLE_INTROSPECTION=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.la
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/ayatana-ido/archive/refs/tags/0.10.4.tar.gz
        sha256: bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38

  # 👉 使用前：git submodule add https://github.com/flathub/shared-modules.git
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: bit
    buildsystem: simple
    build-options:
      append-path: /app/bin:/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        npm_config_yes: 'true'
        CARGO_HOME: /run/build/bit/cargo
    build-commands:
      - npm install --no-audit --no-fund
      - npm run tauri build -- --no-bundle
      - install -Dm755 src-tauri/target/release/bit /app/bin/bit
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/space.osbt.bit.png
      - install -Dm644 packaging/flatpak/space.osbt.bit.desktop /app/share/applications/space.osbt.bit.desktop
      - install -Dm644 packaging/flatpak/space.osbt.bit.metainfo.xml /app/share/metainfo/space.osbt.bit.metainfo.xml
    sources:
      - type: dir
        path: ../..
