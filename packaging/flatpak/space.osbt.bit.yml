app-id: space.osbt.bit
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
# GNOME SDK（基于 freedesktop 24.08）自带 webkit2gtk-4.1 / javascriptcoregtk-4.1
# 与 vala；freedesktop 原生 SDK 不含 webkit，Tauri 无法在其上编译
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: bit
separate-locales: false
finish-args:
  # 联网：AI 提供方 / 远程访问 API
  - --share=network
  - --share=ipc
  # 图形显示（X11 与 Wayland，Crostini 下走 Wayland）
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # 系统托盘与通知
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Agent 工具需要执行命令 / 读写文件（Shell / 文件 / 技能）
  - --filesystem=home
  - --socket=pulseaudio
modules:
  # libayatana-ido：ayatana-indicator 的缺失上游依赖（共享模块链未包含，runtime 亦无）
  - name: ayatana-ido
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_GTKDOC=OFF
      # cmake 会装到 lib64，而 shared-modules 的 autotools 只查 /app/lib/pkgconfig，强制统一为 lib
      - -DCMAKE_INSTALL_LIBDIR=lib
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.la
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/ayatana-ido/archive/refs/tags/0.10.4.tar.gz
        sha256: bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38
  # Flathub 共享模块（CI 会先克隆到本目录）：intltool → libdbusmenu → libayatana-indicator → libayatana-appindicator
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: bit
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        npm_config_yes: 'true'
      # flatpak-builder 构建沙盒默认断网；build-args 透传给底层 flatpak build，
      # cargo 拉 crates.io 必须联网（npm install --offline 走预烘焙缓存，不受影响）
      build-args:
        - --share=network
    build-commands:
      # 沙盒内直接访问 registry 会黑洞（Exit handler never called）：
      # 用宿主机预热的缓存目录做 --offline 安装，零网络、失败快速可见
      - npm install --offline --cache .npm-flatpak-cache --no-audit --no-fund
      - npm run tauri build -- --no-bundle
      - install -Dm755 src-tauri/target/release/bit /app/bin/bit
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/space.osbt.bit.png
      - install -Dm644 packaging/flatpak/space.osbt.bit.desktop /app/share/applications/space.osbt.bit.desktop
      - install -Dm644 packaging/flatpak/space.osbt.bit.metainfo.xml /app/share/metainfo/space.osbt.bit.metainfo.xml
    sources:
      - type: dir
        path: ../..
