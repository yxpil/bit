app-id: space.osbt.bit
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: bit
separate-locales: false
finish-args:
  # 联网：AI 提供方 / 远程访问 API
  - --share=network
  - --share=ipc
  # 图形显示（X11 与 Wayland，Crostini 下走 Wayland）
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # 系统托盘与通知
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Agent 工具需要执行命令 / 读写文件（Shell / 文件 / 技能）
  - --filesystem=home
  - --socket=pulseaudio
modules:
  # libayatana-ido：ayatana-indicator 的缺失上游依赖（共享模块链未包含，runtime 亦无）
  - name: ayatana-ido
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_GTKDOC=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.la
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/ayatana-ido/archive/refs/tags/0.10.4.tar.gz
        sha256: bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38
  # Flathub 共享模块（CI 会先克隆到本目录）：intltool → libdbusmenu → libayatana-indicator → libayatana-appindicator
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: bit
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        npm_config_yes: 'true'
    build-commands:
      - npm install --no-audit --no-fund
      - npm run tauri build -- --no-bundle
      - install -Dm755 src-tauri/target/release/bit /app/bin/bit
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/space.osbt.bit.png
      - install -Dm644 packaging/flatpak/space.osbt.bit.desktop /app/share/applications/space.osbt.bit.desktop
      - install -Dm644 packaging/flatpak/space.osbt.bit.metainfo.xml /app/share/metainfo/space.osbt.bit.metainfo.xml
    sources:
      - type: dir
        path: ../..
