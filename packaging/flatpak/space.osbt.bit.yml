app-id: space.osbt.bit
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: bit
separate-locales: false
finish-args:
  # 联网：AI 提供方 / 远程访问 API
  - --share=network
  - --share=ipc
  # 图形显示（X11 与 Wayland，Crostini 下走 Wayland）
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # 系统托盘与通知
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Agent 工具需要执行命令 / 读写文件（Shell / 文件 / 技能）
  - --filesystem=home
  - --socket=pulseaudio
modules:
  # Flathub 官方共享模块：libdbusmenu → libindicator → libayatana-appindicator 链式构建
  - name: shared-modules
    type: git
    url: https://github.com/flathub/shared-modules.git
    commit: 6eed6448215ff322f3567f2fba53ea444f5861df
  - shared-modules/libappindicator/libappindicator-gtk3-intro.json
  - name: bit
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        npm_config_yes: 'true'
    build-commands:
      - npm install --no-audit --no-fund
      - npm run tauri build -- --no-bundle
      - install -Dm755 src-tauri/target/release/bit /app/bin/bit
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/space.osbt.bit.png
      - install -Dm644 packaging/flatpak/space.osbt.bit.desktop /app/share/applications/space.osbt.bit.desktop
      - install -Dm644 packaging/flatpak/space.osbt.bit.metainfo.xml /app/share/metainfo/space.osbt.bit.metainfo.xml
    sources:
      - type: dir
        path: ../..
