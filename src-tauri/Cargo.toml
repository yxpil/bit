[package]
name = "bit"
version = "0.2.4"
description = "BIT - Agent Tool Hub with audit and remote access"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rhai = { version = "1", features = ["serde"] }
futures-util = "0.3"
# 附件解析：Excel(calamine) / Word(.docx via zip+xml) / 网页正文(scraper) / base64 解码
calamine = "0.26"
scraper = "0.20"
base64 = "0.22"
zip = "2"
quick-xml = "0.36"
