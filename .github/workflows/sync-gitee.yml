name: sync-gitee

# 每次推送到 main / 打 tag 后，将全部分支与标签镜像同步到 Gitee（https://gitee.com/yxpil/bit）。
# 凭据存于仓库 Secrets：GITEE_USER / GITEE_PASS（Gitee 账号密码原文）。
# 用 Basic Auth 头传递凭据，避免密码特殊字符在 URL 中需要转义的问题。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# main push 与 tag push 会同时触发两次全量镜像推送，互撞会非快进失败
concurrency:
  group: gitee
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 镜像推送到 Gitee
        run: |
          # ① tag push 时 checkout 为 detached HEAD，本地 refs/heads 为空——
          #    用 refs/heads 做源 + --prune 会把远端默认分支也标记删除而被 Gitee 拒绝；
          #    改用 origin/*（fetch-depth:0 后必含全部分支）做源，与 checkout 状态无关
          # ② origin/HEAD 是符号引用，不删会被映射成垃圾分支 heads/HEAD
          git update-ref -d refs/remotes/origin/HEAD 2>/dev/null || true
          git -c "http.extraheader=Authorization: Basic $(printf '%s:%s' "$GITEE_USER" "$GITEE_PASS" | base64)" \
            push --prune --force "https://gitee.com/yxpil/bit.git" \
            "refs/remotes/origin/*:refs/heads/*" "refs/tags/*:refs/tags/*"
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_PASS: ${{ secrets.GITEE_PASS }}
