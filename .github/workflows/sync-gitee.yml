name: sync-gitee

# 每次推送到 main / 打 tag 后，将全部分支与标签镜像同步到 Gitee（https://gitee.com/yxpil/bit）。
# 凭据存于仓库 Secrets：GITEE_USER / GITEE_PASS（Gitee 账号密码原文）。
# 用 Basic Auth 头传递凭据，避免密码特殊字符在 URL 中需要转义的问题。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# main push 与 tag push 会同时触发两次全量镜像推送，互撞会非快进失败
concurrency:
  group: gitee
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 镜像推送到 Gitee
        run: |
          # tag push 时 checkout 为 detached HEAD，本地没有任何 refs/heads——
          # --prune 会把远端默认分支也标记为删除而被 Gitee 拒绝（refusing to delete the current branch）。
          # 先把全部远端分支建立为本地分支，保证 --prune 只清理远端多余分支、绝不误删 main
          git fetch origin "+refs/heads/*:refs/heads/*"
          git -c "http.extraheader=Authorization: Basic $(printf '%s:%s' "$GITEE_USER" "$GITEE_PASS" | base64)" \
            push --prune --force "https://gitee.com/yxpil/bit.git" \
            "refs/heads/*:refs/heads/*" "refs/tags/*:refs/tags/*"
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_PASS: ${{ secrets.GITEE_PASS }}
