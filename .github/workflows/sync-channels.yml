# 全渠道云端自动同步：release 工作流跑完后，自动更新
#   Homebrew tap (yxpil/homebrew-bit) / Scoop bucket (yxpil/scoop-bit) /
#   APT 仓库 (yxpil/apt-repo) / pacman 仓库 (yxpil/pacman-repo) /
#   dnf 仓库 (yxpil/dnf-repo) / winget PR
# 需要 repo secret: CHANNELS_TOKEN（具备上述仓库 contents:write 权限的 PAT）
#
# 两条触发路径：
#   1. release.yml finalize（仅等核心平台）在收尾时 dispatch 本工作流 → 渠道分钟级跟进
#   2. workflow_run 兜底：release 整体（含 exotic QEMU 慢任务）结束后再跑一次，
#      把后上传的 loongarch64/riscv64/ppc64le 等 exotic 资产补进各仓库
name: sync-channels

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 tag（如 v0.5.11）；缺省取最新 release"
        required: false
        type: string
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

jobs:
  channels:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi
      - name: brew / scoop / apt / pacman / dnf
        env:
          GITHUB_TOKEN: ${{ secrets.CHANNELS_TOKEN }}
        run: python3 packaging/channels/sync_channels.py "${{ steps.v.outputs.version }}"

  npm:
    # 渠道同步失败（如个别仓库 404）不应连坐阻塞 npm/winget
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    needs: channels
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish bit-agent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.channels.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN 未配置，跳过 npm 发布"; exit 0; fi
          if [ -z "$V" ]; then V=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); fi
          v="${V#v}"
          if npm view "bit-agent@$v" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "bit-agent@$v 已存在，跳过"; exit 0
          fi
          cd packaging/npm
          npm version "$v" --no-git-tag-version --allow-same-version
          npm publish --access public

  winget:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    needs: channels
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Submit winget manifest PR
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.CHANNELS_TOKEN }}
        run: |
          $v = "${{ needs.channels.outputs.version }}".TrimStart("v")
          irm https://aka.ms/wingetcreate/latest -OutFile wg.exe
          ./wg.exe update yxpil.BIT --version $v `
            --urls "https://github.com/yxpil/bit/releases/download/v$v/BIT_${v}_x64-setup.exe" `
                   "https://github.com/yxpil/bit/releases/download/v$v/BIT_${v}_aarch64-setup.exe" `
            --submit --token $env:WINGET_TOKEN
