name: release

# 手动触发（可指定已有 tag 补发资产）或推送 v* tag 自动触发
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传资产的 tag（如 v0.4.0）"
        required: true
        default: "v0.4.0"
      include_macos:
        description: "是否同时构建 macOS 包"
        type: boolean
        required: false
        default: true
      include_windows:
        description: "是否构建 Windows 包（未签名 exe 会被杀毒误报，可关闭）"
        type: boolean
        required: false
        default: true
      include_exotic:
        description: "是否构建国产/新兴架构（riscv64 / loongarch64，QEMU 模拟编译较慢）"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  # 确保目标 tag 的 Release 已存在（gh release upload 不支持自动创建）
  ensure-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - run: gh api repos/$GITHUB_REPOSITORY/releases/tags/$TAG >/dev/null 2>&1 || gh release create "$TAG" --title "BIT $TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}

  linux:
    needs: ensure-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动补发时检出 main（包含最新兼容性修复），tag 推送时检出对应 tag
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: 构建
        run: |
          npm ci
          npx tauri build
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            --clobber --repo "$GITHUB_REPOSITORY"

  linux-arm:
    needs: ensure-release
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动补发时检出 main（包含最新兼容性修复），tag 推送时检出对应 tag
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: 构建
        run: |
          npm ci
          npx tauri build
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    # Windows x64：MSI + NSIS 双格式（WiX 对 x64 支持完善）
    needs: ensure-release
    if: github.event_name == 'push' || inputs.include_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: 构建
        run: |
          npm ci
          npx tauri build
      - name: 打包便携版（免安装单文件 exe）
        shell: pwsh
        env:
          TAG: ${{ needs.ensure-release.outputs.tag }}
        run: |
          # Tauri v2 在 MSVC 目标下静态链接 WebView2LoaderStatic（见 webview2-com-sys/src/lib.rs），
          # BIT.exe 自包含，无需携带 WebView2Loader.dll；运行时仅依赖系统 WebView2 Runtime
          Test-Path src-tauri/target/release/BIT.exe
          Compress-Archive -Path src-tauri/target/release/BIT.exe -DestinationPath "BIT_$($env:TAG.TrimStart('v'))_x64-portable.zip" -Force
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.ensure-release.outputs.tag }}"
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            BIT_*_x64-portable.zip \
            --clobber --repo "$GITHUB_REPOSITORY"

  windows-arm:
    needs: ensure-release
    # Windows ARM64（Surface / 骁龙 X 笔记本）：MSI 的 WiX 工具链对 ARM64 支持差，用 NSIS
    if: github.event_name == 'push' || inputs.include_windows
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: 构建
        run: |
          npm ci
          npx tauri build --target aarch64-pc-windows-msvc --bundles nsis
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.ensure-release.outputs.tag }}"
          gh release upload "$TAG" \
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe \
            --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    needs: ensure-release
    if: github.event_name == 'push' || inputs.include_macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: 构建 arm64 + x86_64
        run: |
          npm ci
          npx tauri build --target aarch64-apple-darwin
          npx tauri build --target x86_64-apple-darwin
      - name: 补全 ad-hoc bundle 签名（避免 Gatekeeper 报"已损坏"）
        run: |
          # tauri bundler 只对二进制做 linker 签名，bundle 缺 CodeResources/PkgInfo，
          # 下载后带 quarantine 属性时 macOS 会判定签名不自洽 → "已损坏，无法打开"。
          # 此处补 PkgInfo 并对整个 .app 做 ad-hoc 深签名，使 bundle 签名自洽。
          for T in aarch64-apple-darwin x86_64-apple-darwin; do
            APP="src-tauri/target/$T/release/bundle/macos/BIT.app"
            printf 'APPL????' > "$APP/Contents/PkgInfo"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict "$APP"
          done
      - name: 重打 dmg + 打包便携版 .app zip（包含签名修复后的 .app）
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          for T in aarch64-apple-darwin x86_64-apple-darwin; do
            case $T in aarch64*) DMGARCH=aarch64;; *) DMGARCH=x64;; esac
            APP="src-tauri/target/$T/release/bundle/macos/BIT.app"
            DMGDIR="src-tauri/target/$T/release/bundle/dmg"
            STAGE=$(mktemp -d)
            cp -R "$APP" "$STAGE/BIT.app"
            ln -s /Applications "$STAGE/Applications"
            rm -f "$DMGDIR"/BIT_*.dmg
            hdiutil create -volname "BIT" -srcfolder "$STAGE" -ov -format UDZO -fs HFS+ "$DMGDIR/BIT_${VERSION}_${DMGARCH}.dmg"
            rm -rf "$STAGE"
            # 便携版：免安装 .app zip（对齐 Windows portable 产物）
            # 必须用 ditto 保留代码签名与扩展属性，普通 zip 会破坏签名导致"已损坏"
            ditto -c -k --keepParent --sequesterRsrc "$APP" "$DMGDIR/BIT_${VERSION}_${DMGARCH}-app.zip"
          done
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release upload "$TAG" \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*-app.zip \
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*-app.zip \
            --clobber --repo "$GITHUB_REPOSITORY"

  linux-exotic:
    needs: ensure-release
    # 国产/新兴架构：龙芯 LoongArch64（3A5000/3A6000）与 RISC-V 64（VisionFive 2 等）。
    # GitHub 无原生 runner，用 QEMU binfmt 跑对应架构 Debian 容器原生编译（模拟编译较慢，约 1~3 小时）。
    # 产出 deb + 裸二进制 tar.gz（AppImageKit 不支持这两种架构）。
    # 飞腾/鲲鹏/麒麟 ARM = linux-arm 的 aarch64 包；兆芯/海光 = linux 的 x86_64 包；申威 SW64 无 Rust 工具链，无法支持。
    if: github.event_name == 'push' || inputs.include_exotic != false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            platform: linux/riscv64
          # loong64 社区镜像的 manifest 架构名是非标准的 "loong64"，按 digest 固定拉取
          # （digest 对应 trixie 版 loong64 变体），运行时靠 binfmt 的 qemu-loongarch64 处理
          - arch: loongarch64
            image: ghcr.io/loong64/debian@sha256:df06b06128d3b935288d4f601bab42ba68fd61730fd0957b1ef197f1df79346c
            platform: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 构建前端 dist（宿主机 x64 完成，容器内只编译 Rust）
        run: npm ci && npm run build
      - name: 安装 QEMU 模拟器（riscv64 + loongarch64）
        run: |
          # tonistiigi/binfmt 不含 loongarch64，改用 Ubuntu 自带 qemu-user-static（qemu 8.2，含 loongarch64）
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          ls /proc/sys/fs/binfmt_misc/ | grep -qx "qemu-loongarch64"
          ls /proc/sys/fs/binfmt_misc/ | grep -qx "qemu-riscv64"
      - name: 容器内构建（${{ matrix.arch }}）
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          PLATFORM="${{ matrix.platform }}"
          docker run --rm ${PLATFORM:+--platform $PLATFORM} \
            -v "$PWD":/repo -w /repo \
            ${{ matrix.image }} \
            bash packaging/exotic/build.sh ${{ matrix.arch }} "${VERSION#v}"
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.ensure-release.outputs.tag }}"
          gh release upload "$TAG" \
            packaging/exotic/out/bit_*.deb \
            packaging/exotic/out/bit_*.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"

  # 收尾：核心平台构建完成后，自动生成 latest.json 上传到 Release，
  # 并触发 mirror-pages 刷新 GitHub Pages 镜像（更新检测三级回退的第一级）。
  # exotic（QEMU 模拟编译）耗时不稳定，失败不阻塞发布。
  finalize:
    needs: [ensure-release, linux, linux-arm, windows, windows-arm, macos]
    if: >-
      always() && !cancelled() &&
      needs.ensure-release.result == 'success' &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.linux-arm.result == 'success' || needs.linux-arm.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.windows-arm.result == 'success' || needs.windows-arm.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: 生成 latest.json + 触发 Pages 镜像
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ensure-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          # notes 取 Release 说明前 300 字符，与客户端 GitHub API 回退路径的截断一致
          NOTES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | head -c 300)
          jq -n --arg v "$VERSION" --arg n "$NOTES" --arg u "https://yxpil.github.io/bit/$VERSION/" \
            '{version: $v, notes: $n, url: $u}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          gh workflow run mirror-pages.yml -f tag="$TAG" --repo "$GITHUB_REPOSITORY"
          echo "latest.json 已上传，Pages 镜像已触发（tag=$TAG）"
