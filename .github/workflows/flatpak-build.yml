name: flatpak-build

# 构建 Flatpak 包并产出 .flatpak bundle（后续可 PR 到 Flathub 上架）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packaging/flatpak/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flatpak 工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08 \
            org.freedesktop.Sdk.Extension.node22//24.08

      - name: 构建 Flatpak
        run: flatpak-builder --user --force-clean --repo=repo build-dir packaging/flatpak/space.osbt.bit.yml

      - name: 导出 bundle
        run: flatpak build-bundle repo bit-0.4.9.flatpak space.osbt.bit

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: bit-0.4.9.flatpak
