name: mirror-pages

# 将 Release 资产镜像到 GitHub Pages（https://yxpil.github.io/bit/）。
# osbt.space 等下载入口直链该地址：直连 200 不重定向，文件托管在 GitHub，无需自有服务器。
# 每次部署为全量站点（仅含最新 tag 的资产），旧版本资产由 GitHub Releases 本身承担。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要镜像的 tag（留空自动取最新 Release）"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署互斥，新部署覆盖旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4
      - name: 下载 Release 资产并组装站点
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # 未显式指定 tag 时自动取最新 Release（避免默认旧 tag 把站点覆盖回旧版本）
          if [ -z "$TAG" ]; then TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); fi
          echo "镜像 $TAG"
          VERSION="${TAG#v}"
          mkdir -p "site/$VERSION"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "site/$VERSION"
          # latest.json 提到站点根：客户端自动更新检测优先请求 /bit/latest.json
          if [ -f "site/$VERSION/latest.json" ]; then cp "site/$VERSION/latest.json" site/latest.json; fi

          # 版本目录内的资产清单行：文件名 + 人类可读大小（黑白极简 pill 风格）
          ITEM_LIST=$(cd "site/$VERSION" && ls -1 | while read -r f; do
            s=$(wc -c < "$f" | tr -d ' ')
            h=$(numfmt --to=iec --suffix=B "$s" 2>/dev/null || printf '%sB' "$s")
            printf '<li><a href="./%s"><span>%s</span><span class="size">%s</span></a></li>\n' "$f" "$f" "$h"
          done)

          CSS=$(cat <<'CSSEOF'
          :root{color-scheme:light}
          *{box-sizing:border-box}
          body{margin:0;padding:44px 16px;background:#fff;color:#111;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;text-align:center}
          h1{font-size:22px;margin:0 0 4px;letter-spacing:.5px}
          .sub{color:#666;font-size:13px;margin:0 0 28px}
          ul{list-style:none;margin:0 auto;padding:0;max-width:560px;display:flex;flex-direction:column;gap:8px;text-align:left}
          li{margin:0;min-width:0}
          a{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #111;border-radius:999px;padding:10px 18px;color:#111;text-decoration:none;font-size:14px;min-width:0}
          a span:first-child{overflow-wrap:anywhere}
          a:hover{background:#111;color:#fff}
          .size{color:inherit;opacity:.55;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
          .foot{margin-top:32px;font-size:12px;color:#666}
          .foot a{display:inline;border:0;padding:0;border-radius:0;color:#666;text-decoration:underline}
          .foot a:hover{background:none;color:#111}
          CSSEOF
          )

          # 版本页：/bit/<版本>/ —— 该版本全部资产的直链列表
          cat > "site/$VERSION/index.html" <<PAGEEOF
          <!doctype html>
          <html lang="zh-CN">
          <head>
          <meta charset=utf-8>
          <meta name=viewport content="width=device-width,initial-scale=1">
          <title>BIT $VERSION 下载 / Downloads</title>
          <style>$CSS</style>
          </head>
          <body>
          <h1>BIT $VERSION</h1>
          <p class=sub>全部资产直链 · All release assets（GitHub Pages 镜像 / mirror）</p>
          <ul>
          $ITEM_LIST
          </ul>
          <p class=foot>BIT 永久免费 / BIT is free forever · <a href="https://osbt.space">osbt.space</a> · <a href="https://github.com/yxpil/bit">GitHub</a> · <a href="./latest.json">latest.json</a></p>
          </body>
          </html>
          PAGEEOF

          # 站点首页：/bit/ —— 最新版本入口
          cat > site/index.html <<ROOTEOF
          <!doctype html>
          <html lang="zh-CN">
          <head>
          <meta charset=utf-8>
          <meta name=viewport content="width=device-width,initial-scale=1">
          <title>BIT 下载 / Downloads</title>
          <style>$CSS</style>
          </head>
          <body>
          <h1>BIT</h1>
          <p class=sub>最新版本 / Latest: v$VERSION</p>
          <ul>
          <li><a href="$VERSION/"><span>v$VERSION 全部文件 / All files</span></a></li>
          <li><a href="latest.json"><span>自动更新清单 / Update manifest (latest.json)</span></a></li>
          </ul>
          <p class=foot>BIT 永久免费 / BIT is free forever · <a href="https://osbt.space">osbt.space</a> · <a href="https://github.com/yxpil/bit">GitHub</a></p>
          </body>
          </html>
          ROOTEOF
          ls -la "site/$VERSION"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
